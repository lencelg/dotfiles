icons_format = "{icon}"

[theme]
theme = "semi-native"
[theme.overrides]
idle_fg = "#ebdbb2"
info_fg = "#458588"
good_fg = "#8ec07c"
warning_fg = "#fabd2f"
critical_fg = "#fb4934"

[icons]
icons = "awesome4"
[icons.overrides]
bat = ["|E|", "|_|", "|=|", "|F|"]
bat_charging = "|^| "

[[block]]
block = "focused_window"
[block.format]
full = " $title.str(max_w:40) |"
short = " $title.str(max_w:20) |"

[[block]]
block = "weather"
format = "sunrise $sunrise.datetime(f:'%R') sunset $sunset.datetime(f:'%R')"
interval = 36000
[block.service]
name = "metno"
coordinates = ["22.2769", "113.5678"]
forecast_hours = 12

[[block]]
block = "net"
format = "$ip "


[[block]]
block = "cpu"
info_cpu = 20
warning_cpu = 50
critical_cpu = 90

[[block]]
block = "nvidia_gpu"
interval = 2
format = " $icon $utilization $temperature $clocks "

[[block]]
block = "disk_space"
path = "/"
info_type = "available"
alert_unit = "GB"
interval = 20
warning = 20.0
alert = 10.0
format = " $icon:$available.eng(w:2) "

[[block]]
block = "memory"
format = " $icon $mem_total_used_percents.eng(w:2) "
interval = 2

[[block]]
block = "sound"
[[block.click]]
button = "left"
cmd = "pavucontrol"

[[block]]
block = "time"
interval = 5
format = " $timestamp.datetime(f:'%a %d/%m %R') "
