[opener]
# NOTE: yazi >= 25.5 replaced the old "$@" / "$1" placeholders with
# %s (all hovered files) / %s1 (single file) / %d1 (parent dir).
# The old "$@" was passed to $SHELL -c verbatim, where it expanded to
# nothing -- so nvim was launched with zero arguments (empty buffer).
edit = [
    { run = 'nvim %s', block = true, desc = "Neovim" }
]
play = [
    { run = 'mpv %s', block = true, desc = "MPV Player" }
]
web = [
    { run = 'brave %s', orphan = true, desc = "open in brave browser" }
]

[open]
prepend_rules = [
    { url = "*.json", use = "edit" },
    
    { mime = "video/*", use = "play" },

    { url = "*.mp3", use = "play"},
    
    { url = "*.html", use = [ "open", "edit" ] }
]
